<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.18" intercept="0.82"/>
      <feFuncG type="linear" slope="0.18" intercept="0.82"/>
      <feFuncB type="linear" slope="0.18" intercept="0.82"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" filter="url(#paper)"/>
</svg>
